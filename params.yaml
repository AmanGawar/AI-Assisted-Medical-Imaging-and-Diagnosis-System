classifier:
  archive: data/rsna/images.zip
  annotations: data/rsna/annotations.json
  output: models/classifier.pt
  metrics_output: reports/classifier_metrics.json
  epochs: 2
  batch_size: 8
  max_samples: 2000
  seed: 42

segmentation:
  data_dir: data/msd/Task06_Lung
  output: models/segmentation.pt
  metrics_output: reports/segmentation_metrics.json
  epochs: 10
  batch_size: 1
  max_cases: 16
  roi_size: 64
  validation_fraction: 0.25
  seed: 42
